<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#F8F5EF"/>
  <!-- A lowercase serif s, sized so its x-height fills the tile: at 16px the
       shape still reads, which a small letter on a large em would not. -->
  <text x="32" y="53" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="86" fill="#1A1A16">s</text>
</svg>
