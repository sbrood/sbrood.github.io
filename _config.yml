# ---------------------------------------------------------------------------
# Sarah Brood — personal academic website
# Plain Jekyll, no theme. Everything that renders lives in _layouts, _includes
# and assets/css/style.css. Content lives in _papers, _talks, _teaching.
# ---------------------------------------------------------------------------

title: Sarah Brood
lang: en
url: "https://sbrood.github.io"
baseurl: ""
repository: "sbrood/sbrood.github.io"

description: >-
  Sarah Brood is a PhD student at INRIA Paris and the École Normale Supérieure
  de Paris, working on methods that make models better at monitoring forests
  from remote sensing data.

author:
  name: Sarah Brood
  email: sarah.brood@ens.fr

nav:
  - title: Home
    url: /
  - title: Papers
    url: /papers/
  - title: Activities
    url: /activities/
  - title: CV
    url: /cv/

collections:
  papers:
    output: true
    permalink: /papers/:name/
  talks:
    output: false
  teaching:
    output: false

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      # Only papers with a project page are offered to search engines; the
      # others exist as a fallback but are not linked or indexed.
      sitemap: false

# Without this, Jekyll lists a future-dated document in the indexes but refuses
# to write its page — the link appears and 404s. Papers and talks are routinely
# dated ahead of today, so this must stay true.
future: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from   # keeps the old /talks/ URL working

exclude:
  # never publish a stray older CV: they can carry a postal address
  - "files/*.previous"
  - "files/*.bak"
  - bin
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - pixi.toml
  - pixi.lock
  - .pixi
  - vendor
