<footer class="site-foot">
  <div class="wrap">
    <p>
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
    </p>
  </div>
</footer>
<script>
  // Reassembles every obfuscated address on the page. See _includes/email.html.
  (function () {
    var flip = function (s) { return s.split("").reverse().join(""); };
    Array.prototype.forEach.call(document.querySelectorAll(".js-mail"), function (el) {
      var u = el.getAttribute("data-u"), h = el.getAttribute("data-h");
      if (!u || !h) return;
      var address = flip(u) + String.fromCharCode(64) + flip(h);
      el.textContent = address;
      if (el.tagName === "A") el.href = "mailto:" + address;
    });
  })();
</script>
